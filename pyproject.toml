[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "tilemark"
dynamic = ["version"]
description = "Burn a tiled, hard-to-remove watermark into every PDF and image of a folder."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Thomas Cappelli" }]
requires-python = ">=3.10"
dependencies = ["pypdfium2>=4.30", "pillow>=10.1"]
keywords = ["watermark", "pdf", "privacy", "identity documents", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/thomascapelo/tilemark"
Issues = "https://github.com/thomascapelo/tilemark/issues"
Changelog = "https://github.com/thomascapelo/tilemark/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=8", "pikepdf>=9", "ruff>=0.6"]

[project.scripts]
tilemark = "tilemark.cli:main"

[tool.setuptools]
packages = ["tilemark"]

[tool.setuptools.dynamic]
version = { attr = "tilemark.__version__" }

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["tilemark"]
known-local-folder = ["conftest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
